name: Build SuperTunnel APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply SuperTunnel native tuning
        run: git apply patches/lwip-performance.patch

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        # API 37 is published under the 37.0 package identifier on Google's
        # current repository; the installed platform still exposes API 37 to
        # Gradle as compileSdk 37.
        run: sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Bootstrap Android OpenSSL
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TOOL_BIN="$RUNNER_TEMP/android-cross-tools"
          mkdir -p "$TOOL_BIN"
          ln -sf "$NDK_BIN/aarch64-linux-android26-clang" "$TOOL_BIN/aarch64-linux-android-clang"
          ln -sf "$NDK_BIN/aarch64-linux-android26-clang++" "$TOOL_BIN/aarch64-linux-android-clang++"
          ln -sf "$NDK_BIN/llvm-ar" "$TOOL_BIN/aarch64-linux-android-ar"
          ln -sf "$NDK_BIN/llvm-ranlib" "$TOOL_BIN/aarch64-linux-android-ranlib"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "CC=$NDK_BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX=$NDK_BIN/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          cargo build --manifest-path ci/android-openssl-bootstrap/Cargo.toml --release --target aarch64-linux-android
          OPENSSL_INSTALL="$(find "$GITHUB_WORKSPACE/ci/android-openssl-bootstrap/target/aarch64-linux-android/release/build" -type d -path '*/openssl-build/install' -print -quit)"
          test -n "$OPENSSL_INSTALL"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_INSTALL" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INSTALL/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$OPENSSL_INSTALL/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_SSL_LIBRARY=$OPENSSL_INSTALL/lib/libssl.a" >> "$GITHUB_ENV"
          echo "OPENSSL_CRYPTO_LIBRARY=$OPENSSL_INSTALL/lib/libcrypto.a" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Build Slipstream client for arm64
        working-directory: third_party/slipstream-rust
        env:
          CARGO_BUILD_TARGET: aarch64-linux-android
          ANDROID_ABI: arm64-v8a
          ANDROID_PLATFORM: android-26
        run: cargo build --release -p slipstream-client --target aarch64-linux-android --features openssl-vendored,picoquic-minimal-build

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supertunnel-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
